<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eunice Café — Pro</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'DM Sans', sans-serif;
  background: #120b04;
  color: #f5edd8;
}

.app {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1d140a;
  border: 1px solid rgba(212,168,83,0.15);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 12px;
  padding: 12px;
  background: rgba(212,168,83,0.15);
  color: #f5edd8;
  width: 100%;
  margin-top: 8px;
}

button.selected {
  background: rgba(212,168,83,0.35);
}

button.primary {
  background: linear-gradient(135deg,#c17f3a,#d4a853);
  color: #120b04;
  font-weight: 600;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

.drink {
  padding: 14px;
  border-radius: 14px;
  background: #24190d;
  margin-top: 10px;
}

.loading {
  opacity: 0.7;
  font-style: italic;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  margin-right: 6px;
  background: rgba(255,255,255,0.08);
}
</style>
</head>

<body>
<div class="app">

  <h2>☕ Eunice Café Pro</h2>
  <div class="small">AI-powered drink generator</div>

  <div class="card">
    <h4>Drink Type</h4>
    <button onclick="select('type','coffee',this)">Coffee</button>
    <button onclick="select('type','matcha',this)">Matcha</button>
    <button onclick="select('type','tea',this)">Tea</button>
    <button onclick="select('type','cocktail',this)">Cocktail</button>
  </div>

  <div class="card">
    <h4>Alcohol</h4>
    <button onclick="select('alc','non-alcoholic',this)">Non-Alc</button>
    <button onclick="select('alc','alcoholic',this)">Alcoholic</button>
    <button onclick="select('alc','both',this)">Both</button>
  </div>

  <button class="primary" onclick="generate()" id="genBtn">
    ✨ Generate Drinks
  </button>

  <div id="output"></div>

</div>

<script>
const API_URL = "orange-disk-9c82.m2kr4qvcn8.workers.dev";

let state = {
  type: null,
  alc: null,
  loading: false,
  favorites: JSON.parse(localStorage.getItem("fav") || "[]")
};

function select(key, val, el) {
  state[key] = val;

  document.querySelectorAll(`button`).forEach(b => {
    if (b.textContent === el.textContent || b.dataset?.key === key) {
      b.classList.remove("selected");
    }
  });

  el.classList.add("selected");
}

function setLoading(v) {
  state.loading = v;
  document.getElementById("genBtn").disabled = v;
  document.getElementById("genBtn").textContent = v ? "Brewing..." : "✨ Generate Drinks";
}

async function generate() {
  if (state.loading) return;

  setLoading(true);

  const prompt = `
Create 3 aesthetic café drinks.

Type: ${state.type}
Alcohol: ${state.alc}

Return JSON:
{
 "drinks":[{"name":"","emoji":"","description":""}]
}
`;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();
    const text = data.content?.[0]?.text || "";

    const clean = text.replace(/```json|```/g,'');
    const parsed = JSON.parse(clean);

    render(parsed.drinks);

  } catch (e) {
    document.getElementById("output").innerHTML =
      "<div class='card'>⚠️ Error generating drinks. Try again.</div>";
  }

  setLoading(false);
}

function render(drinks) {
  const out = document.getElementById("output");

  out.innerHTML = drinks.map((d,i)=>`
    <div class="drink">
      <div>
        <b>${d.emoji || "☕"} ${d.name}</b>
      </div>
      <div class="small">${d.description}</div>

      <button onclick="saveFav(${i})">♡ Save</button>
      <button onclick="copy('${d.name}')">Share</button>
    </div>
  `).join("");
}

function saveFav(i) {
  alert("Saved to favorites (demo ready)");
}

function copy(text) {
  navigator.clipboard.writeText(text);
  alert("Copied!");
}
</script>

</body>
</html>
