// ─────────────────────────────────────────────
// FILTER ENGINE (REPLACES API)
// ─────────────────────────────────────────────

function scoreDrink(d) {
  let score = 0;

  if (!state.type || state.type === 'any') score += 1;
  else if (d.type === state.type) score += 3;

  if (state.mood && d.mood === state.mood) score += 3;

  const ingr = [...state.ingredients];
  ingr.forEach(i => {
    if ((d.base && d.base.includes(i.toLowerCase())) ||
        (d.sweet && d.sweet.includes(i.toLowerCase())) ||
        (d.extras && d.extras.join(' ').toLowerCase().includes(i.toLowerCase())) ||
        (d.milk && d.milk.includes(i.toLowerCase()))) {
      score += 1;
    }
  });

  if (state.alcohol === 'non-alcoholic' && d.type === 'cocktail') score -= 10;
  if (state.alcohol === 'alcoholic' && d.type !== 'cocktail') score -= 2;

  return score;
}

function generateDrinks() {
  const btn = document.getElementById('generateBtn');
  const results = document.getElementById('resultsSection');
  const list = document.getElementById('drinksList');

  btn.disabled = true;
  btn.textContent = '✦ Brewing your menu…';

  results.classList.add('visible');
  list.innerHTML = `<div class="loading-card">Brewing from your café library… ☕</div>`;

  const sorted = [...DRINK_LIBRARY]
    .map(d => ({ ...d, score: scoreDrink(d) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);

  setTimeout(() => {
    renderDrinks(sorted.map(d => ({
      name: d.name,
      emoji: d.emoji,
      type: d.type,
      isAlcoholic: d.type === 'cocktail',
      description: `A ${d.mood} ${d.type} crafted from your selected ingredients.`,
      ingredients: d.extras,
      steps: ["Mix ingredients", "Serve with ice", "Enjoy"]
    })));

    document.getElementById('resultsMeta').textContent = 'Top 3 drinks from your café library';

    btn.disabled = false;
    btn.textContent = '✦ Craft Eunice\'s Menu ✦';
  }, 600);
}

function renderDrinks(drinks) {
  const list = document.getElementById('drinksList');
  list.innerHTML = drinks.map((d, i) => `
    <div class="drink-card">
      <div class="dc-top">
        <div class="dc-emoji">${d.emoji}</div>
        <div class="dc-info">

        </div>
      </div>
      <div class="dc-body">
        <div class="dc-desc">${d.description}</div>
      </div>
    </div>
  `).join('');
}
