<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eunice Home Café</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #F5EDD8;
  --gold: #D4A853;
  --matcha: #7A9E5F;
  --midnight: #160F06;
  --surface: #1E1509;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--midnight);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  text-align: center;
  margin-bottom: 20px;
}

.step { margin-bottom: 20px; }

.opt-btn {
  display:block;
  width:100%;
  margin:6px 0;
  padding:12px;
  border-radius:10px;
  border:1px solid #555;
  background:#222;
  color:#eee;
}

.opt-btn.selected {
  border-color: var(--gold);
  color: var(--gold);
}

.generate-btn {
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background: var(--gold);
  color:black;
  font-weight:bold;
  margin-top:20px;
}

.result {
  margin-top:20px;
  padding:15px;
  background: var(--surface);
  border-radius:12px;
}
</style>
</head>

<body>

<div class="app">

<h1>Eunice Home Café</h1>

<div class="step">
  <p>Drink type</p>
  <button class="opt-btn" onclick="pick(this,'coffee')">Coffee</button>
  <button class="opt-btn" onclick="pick(this,'matcha')">Matcha</button>
  <button class="opt-btn" onclick="pick(this,'tea')">Tea</button>
  <button class="opt-btn" onclick="pick(this,'cocktail')">Cocktail</button>
</div>

<div class="step">
  <p>Mood</p>
  <button class="opt-btn" onclick="pick(this,'cozy')">Cozy</button>
  <button class="opt-btn" onclick="pick(this,'refreshing')">Fresh</button>
  <button class="opt-btn" onclick="pick(this,'indulgent')">Indulgent</button>
  <button class="opt-btn" onclick="pick(this,'energizing')">Energizing</button>
</div>

<button class="generate-btn" onclick="generate()">Craft Menu</button>

<div id="results"></div>

</div>

<script>

// ─────────────────────────────
// FULL DRINK LIBRARY
// ─────────────────────────────
const DRINK_LIBRARY = [
{
  name: "Velvet Oat Latte",
  type: "coffee",
  mood: "cozy",
  desc: "Warm oat latte with soft cinnamon finish."
},
{
  name: "Iced Caramel Cloud Latte",
  type: "coffee",
  mood: "indulgent",
  desc: "Sweet caramel espresso with creamy foam."
},
{
  name: "Midnight Cold Brew",
  type: "coffee",
  mood: "energizing",
  desc: "Bold cold brew with vanilla and sea salt."
},
{
  name: "Honey Cinnamon Latte",
  type: "coffee",
  mood: "cozy",
  desc: "Smooth espresso with honey spice warmth."
},
{
  name: "Dirty Vanilla Latte",
  type: "coffee",
  mood: "energizing",
  desc: "Strong espresso with soft vanilla milk."
},
{
  name: "Ceremonial Matcha Cloud",
  type: "matcha",
  mood: "cozy",
  desc: "Light airy matcha with oat milk foam."
},
{
  name: "Iced Strawberry Matcha",
  type: "matcha",
  mood: "refreshing",
  desc: "Fruity matcha with strawberry brightness."
},
{
  name: "Dirty Matcha Latte",
  type: "matcha",
  mood: "energizing",
  desc: "Bold espresso meets earthy matcha."
},
{
  name: "Brown Sugar Matcha Latte",
  type: "matcha",
  mood: "indulgent",
  desc: "Sweet brown sugar with chewy boba."
},
{
  name: "Jasmine Milk Tea Latte",
  type: "tea",
  mood: "cozy",
  desc: "Floral jasmine tea with creamy milk."
},
{
  name: "Brown Sugar Boba Milk Tea",
  type: "tea",
  mood: "indulgent",
  desc: "Rich milk tea with caramel boba."
},
{
  name: "Oolong Cream Tea",
  type: "tea",
  mood: "refreshing",
  desc: "Smooth oolong with vanilla cream notes."
},
{
  name: "Earl Grey Velvet Tea",
  type: "tea",
  mood: "cozy",
  desc: "Aromatic Earl Grey with soft milk finish."
},
{
  name: "Yuzu Gin Spritz",
  type: "cocktail",
  mood: "refreshing",
  desc: "Citrus gin spritz with sparkling soda."
},
{
  name: "Vanilla Rum Sunset",
  type: "cocktail",
  mood: "indulgent",
  desc: "Warm vanilla rum with orange glow."
},
{
  name: "Espresso Martini Twist",
  type: "cocktail",
  mood: "energizing",
  desc: "Bold coffee cocktail with vodka kick."
},
{
  name: "Honey Whiskey Highball",
  type: "cocktail",
  mood: "cozy",
  desc: "Smooth whiskey with honey warmth."
},
{
  name: "Rose Vanilla Cloud Latte",
  type: "coffee",
  mood: "indulgent",
  desc: "Floral rose latte with vanilla foam."
},
{
  name: "Lavender Night Tea",
  type: "tea",
  mood: "cozy",
  desc: "Calming lavender tea for slow nights."
},
{
  name: "Coconut Cloud Cold Brew",
  type: "coffee",
  mood: "refreshing",
  desc: "Tropical coconut cold brew latte."
}
];

// ─────────────────────────────
// STATE
// ─────────────────────────────
let selections = {};

// FIXED PICK LOGIC
function pick(btn, val){
  const group = btn.parentElement;
  group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  const label = group.children[0].innerText.trim(); // "Drink type" / "Mood"
  selections[label] = val;
}

// ─────────────────────────────
// FILTER ENGINE (NO API)
// ─────────────────────────────
function generate(){
  const el = document.getElementById('results');
  el.innerHTML = "Brewing... ☕";

  const type = selections["Drink type"];
  const mood = selections["Mood"];

  let results = DRINK_LIBRARY;

  if (type) results = results.filter(d => d.type === type);
  if (mood) results = results.filter(d => d.mood === mood);

  // fallback if nothing matches
  if (results.length === 0) {
    results = DRINK_LIBRARY;
  }

  results = results.slice(0, 3);

  setTimeout(() => {
    el.innerHTML = results.map(d => `
      <div class="result">
        <h3>${d.name}</h3>
        <p>${d.desc}</p>
      </div>
    `).join('');
  }, 600);
}

</script>

</body>
</html>
